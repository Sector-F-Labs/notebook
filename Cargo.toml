[package]
name = "notebook"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "WYSIWYG markdown notes for a folder of .md files, built with egui and Patina"
repository = "https://github.com/Sector-F-Labs/notebook"

[dependencies]
dirs = "7"
eframe = { version = "0.35", features = ["persistence"] }
egui = "0.35"
egui_extras = { version = "0.35", features = ["syntect"] }
image = { version = "0.25", default-features = false, features = ["png"] }
patina-ui = "0.1.3"
pulldown-cmark = { version = "0.13", default-features = false }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "1"
trash = "5"

[dev-dependencies]
resvg = "0.48.1"

